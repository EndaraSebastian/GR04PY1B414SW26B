<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Códigos QR del parqueadero · EPN</title>
    <link rel="stylesheet" href="/codigos.css">
</head>
<body>
    <main>
        <a class="volver" href="/">Volver a la aplicación</a>
        <p class="institucion">Escuela Politécnica Nacional</p>
        <h1>Códigos QR del parqueadero</h1>
        <p class="instruccion">Inicia sesión en tu celular, elige ingreso o salida y escanea el código correspondiente. Puedes abrir esta página en otra pantalla o imprimirla.</p>
        <div class="codigos">
            <section class="tarjeta" aria-labelledby="titulo-entrada">
                <h2 id="titulo-entrada">Ingreso</h2>
                <img src="/qr-entrada.png" width="406" height="406" alt="Código QR de ingreso">
            </section>
            <section class="tarjeta" aria-labelledby="titulo-salida">
                <h2 id="titulo-salida">Salida</h2>
                <img src="/qr-salida.png" width="406" height="406" alt="Código QR de salida">
            </section>
        </div>
    </main>
</body>
</html>
